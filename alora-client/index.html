<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alora-client</title>
  </head>
  <body>
    <main class="app container">
      <h1>Alora app</h1>

      <div class="mb-40">
        <h2>Feature 2 : Swipper les phrase</h2>
        <div class="swiper">
          <div class="swiper-wrapper"></div>
          <div class="swiper-scrollbar"></div>
        </div>
      </div>

      <div>
        <h2>Feature 1 : Stocker phrase + prononcer</h2>
        <h3>
          Correction --><span class="js-corrected-text"></span><br />
          Traduction --><span class="js-translated-text"></span><br />
          Phrase Random --><span class="js-random-sentence"></span>
        </h3>
        <form>
          <input
            type="text"
            class="js-text-input"
            id="text-input"
            placeholder="Traduire phrase..."
          />
          <button type="submit" class="js-submit-btn">Submit</button>
        </form>
        <button class="secondary js-log-storage">Log localStorage</button>
        <button class="secondary js-clear">Delete all sentences</button>
        <button class="secondary js-read">Read sentence</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/swipeSentences.ts"></script>
  </body>
</html>
